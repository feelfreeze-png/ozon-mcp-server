services:
  ozon-mcp:
    build: .
    container_name: ozon-mcp-server
    ports:
      # По умолчанию только localhost. Веб-интерфейс сервера не проверяет токен
      # (см. FORK.md § 1 и docs/ONBOARDING.md § 4.1): на 0.0.0.0 любой, кто дотянулся
      # до порта, заводит и удаляет магазины. Наружу — только через прокси со своей
      # авторизацией, и тогда BIND_ADDR задаётся осознанно.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    volumes:
      # Каталог на хосте, а НЕ именованный том. Три причины, каждая стоила разбора:
      #
      # 1. Именованный том невидим бэкапу. Наш бэкап архивирует КАТАЛОГ /opt/ozon-mcp;
      #    при томе он исправно сохранял бы устаревшие файлы, оставшиеся в ./data от
      #    прошлой конфигурации, пока сервер работает с другими. Это хуже падения:
      #    архив непустой, снапшот создаётся, а данные в нём не те.
      # 2. `docker compose down -v` стирает том вместе с ключом Fernet и магазинами.
      #    Каталог переживает любую команду compose.
      # 3. Состав данных видно `ls`, а не только изнутри контейнера.
      #
      # ⚠️ До 2026-09-20 это держалось на docker-compose.override.yml, и запуск без него
      # молча переключал сервер на пустой том: магазинов нет, ключей нет, сервер отвечает.
      - ./data:/data
    environment:
      - OZON_CLIENT_ID=${OZON_CLIENT_ID:-}
      - OZON_API_KEY=${OZON_API_KEY:-}
      - OZON_PERF_CLIENT_ID=${OZON_PERF_CLIENT_ID:-}
      - OZON_PERF_CLIENT_SECRET=${OZON_PERF_CLIENT_SECRET:-}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      # Без проброса переменную из .env контейнер молча не увидит, а снаружи это
      # выглядит как «патч не работает» / «профили не режут» / «админка всё ещё открыта».
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - MCP_CLIENT_TOKENS=${MCP_CLIENT_TOKENS:-}
      - OZON_TOOLSETS=${OZON_TOOLSETS:-}
      - OZON_READONLY=${OZON_READONLY:-}
      - HEALTH_CHECK_INTERVAL_MIN=${HEALTH_CHECK_INTERVAL_MIN:-30}
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
