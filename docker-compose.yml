services:
  ozon-mcp:
    build: .
    container_name: ozon-mcp-server
    ports:
      # По умолчанию только localhost. Веб-интерфейс сервера не проверяет токен
      # (см. FORK.md § 1 и docs/ONBOARDING.md § 4.1): на 0.0.0.0 любой, кто дотянулся
      # до порта, заводит и удаляет магазины. Наружу — только через прокси со своей
      # авторизацией, и тогда BIND_ADDR задаётся осознанно.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    volumes:
      - ozon_data:/data
    environment:
      - OZON_CLIENT_ID=${OZON_CLIENT_ID:-}
      - OZON_API_KEY=${OZON_API_KEY:-}
      - OZON_PERF_CLIENT_ID=${OZON_PERF_CLIENT_ID:-}
      - OZON_PERF_CLIENT_SECRET=${OZON_PERF_CLIENT_SECRET:-}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      # Без проброса переменную из .env контейнер молча не увидит, а снаружи это
      # выглядит как «патч не работает» / «профили не режут» / «админка всё ещё открыта».
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - MCP_CLIENT_TOKENS=${MCP_CLIENT_TOKENS:-}
      - OZON_TOOLSETS=${OZON_TOOLSETS:-}
      - OZON_READONLY=${OZON_READONLY:-}
      - HEALTH_CHECK_INTERVAL_MIN=${HEALTH_CHECK_INTERVAL_MIN:-30}
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  ozon_data:
